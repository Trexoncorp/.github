  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="268" y="175" fill="#faf7ff" font-size="72" font-weight="750" letter-spacing="7">TREXON</text>
    <text x="271" y="226" fill="#c6b9dc" font-size="25">Practical infrastructure for modern applications.</text>
    <g font-size="13" font-weight="600" letter-spacing="1.5" fill="#d5c4fa">
      <rect x="272" y="264" width="167" height="33" rx="16.5" fill="#a470f5" fill-opacity=".1" stroke="#644392"/>
      <text x="289" y="285">CONFIGURATION</text>
      <rect x="451" y="264" width="108" height="33" rx="16.5" fill="#a470f5" fill-opacity=".1" stroke="#644392"/>
      <text x="469" y="285">LOGGING</text>

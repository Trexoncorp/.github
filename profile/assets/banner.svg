<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="title desc">
  <title id="title">Trexon — practical infrastructure for modern applications</title>
  <desc id="desc">A purple circuit emblem and the Trexon name on a dark background, with configuration, logging, data, and web building blocks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#11121d"/>
      <stop offset="1" stop-color="#17102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c451f2"/>
      <stop offset="1" stop-color="#6728df"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#bba4ed" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1438" height="398" rx="24" fill="url(#background)" stroke="#332446" stroke-width="2"/>
  <rect x="2" y="2" width="1436" height="396" rx="23" fill="url(#grid)"/>
  <ellipse cx="1170" cy="180" rx="360" ry="280" fill="url(#glow)"/>
  <rect x="80" y="111" width="144" height="144" rx="34" fill="url(#accent)"/>
  <path d="M111 146H176V162H154V220H137V162H111Z" fill="#fff"/>
